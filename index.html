<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Controle Financeiro</title><meta name="theme-color" content="#2d4a7a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Financeiro"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style id="css">
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mute:#6b7380;--line:#e3e6eb;--pix:#1f8a8a;--esp:#c98a1b;--desp:#c2413b;--pos:#1e7d45;--acc:#2d4a7a;--soft:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1c2027;--ink:#e7eaef;--mute:#9aa3b0;--line:#2c323c;--pix:#3fb5b5;--esp:#e0a63a;--desp:#e5645d;--pos:#4cc07a;--acc:#8fb0e6;--soft:#232832}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mute);font-size:13px}
.status{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mute)}
.status.ok{color:var(--pos)}.status.warn{color:var(--esp)}.status.err{color:var(--desp)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.form .c2{grid-column:span 2}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px;cursor:pointer;color:var(--mute)}
.seg button.on[data-t=entrada]{background:var(--pos);color:#fff}
.seg button.on[data-t=despesa]{background:var(--desp);color:#fff}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{background:var(--desp)}
.actions{display:flex;gap:8px}
.msg{font-size:12px;margin-top:8px;min-height:16px}
.msg.err{color:var(--desp)}.msg.ok{color:var(--pos)}
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.monthbar select{width:auto;min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kpis2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:11px;color:var(--mute);margin-top:2px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.pos{color:var(--pos)}.neg{color:var(--desp)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
tbody tr.sel{background:var(--soft)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:-4px 0 8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:600}
.tag.entrada{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.tag.despesa{background:color-mix(in srgb,var(--desp) 15%,transparent);color:var(--desp)}
.empty{color:var(--mute);text-align:center;padding:24px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.row-between h2{margin:0}
svg text{fill:var(--mute);font-size:11px}
@media (max-width:900px){.form{grid-template-columns:repeat(2,1fr)}.form .c2{grid-column:span 2}.kpis{grid-template-columns:repeat(2,1fr)}.kpis2{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
(function(){
var KEY='controle-financeiro-v1',storageOK=true,state;
try{state=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){state={};storageOK=false;}
if(!state||!Array.isArray(state.entries))state={entries:[]};
if(!state.meta)state.meta={};
var root=document.getElementById('root');
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'EUR'});
var BRLc=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'EUR',notation:'compact',maximumFractionDigits:1});
function money(c){return BRL.format(c/100);}
function cls(c){return c>0?'pos':(c<0?'neg':'');}
function pad(n){return String(n).padStart(2,'0');}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function P(iso){var a=iso.split('-').map(Number);return {y:a[0],m:a[1],d:a[2]};}
function daysIn(y,m){return new Date(y,m,0).getDate();}
function dow(y,m,d){return new Date(y,m-1,d).getDay();}
function br(iso){var p=P(iso);return pad(p.d)+'/'+pad(p.m)+'/'+p.y;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var FORMA={pix:'PIX',especie:'Espécie',outro:'Outro'};
function monthKey(iso){return iso.slice(0,7);}
function monthLabel(k){var a=k.split('-');return MESES[Number(a[1])-1]+' de '+a[0];}

var ui={month:monthKey(todayISO()),tipo:'entrada',editId:null,confirmDel:null};
var status='';

function parseValor(s){
  s=String(s).trim().replace(/R\$|€|EUR|\s/g,'');
  if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var v=Number(s);
  if(!isFinite(v)||v<=0)return NaN;
  return Math.round(v*100);
}
function centsToInput(c){return (c/100).toFixed(2).replace('.',',');}

function agg(list){
  var r={pix:0,esp:0,desp:0,despPix:0,despEsp:0,despOutro:0};
  list.forEach(function(e){
    if(e.tipo==='entrada'){if(e.forma==='pix')r.pix+=e.valor;else r.esp+=e.valor;}
    else{r.desp+=e.valor;if(e.forma==='pix')r.despPix+=e.valor;else if(e.forma==='especie')r.despEsp+=e.valor;else r.despOutro+=e.valor;}
  });
  r.ent=r.pix+r.esp;r.saldo=r.ent-r.desp;return r;
}
function weeksOf(y,m){
  var n=daysIn(y,m),w=[],cur=null;
  for(var d=1;d<=n;d++){if(!cur||dow(y,m,d)===1){cur={start:d,end:d};w.push(cur);}cur.end=d;}
  return w;
}

/* ---------- salvar (neste aparelho) ---------- */
function scheduleSave(){
  try{localStorage.setItem(KEY,JSON.stringify(state));status='saved';}
  catch(e){status='error';storageOK=false;}
  setStatus();
}
function daysSince(iso){if(!iso)return null;return Math.floor((Date.now()-new Date(iso).getTime())/86400000);}
function setStatus(){
  var el=document.getElementById('status');if(!el)return;
  var t,c='';
  if(!storageOK||status==='error'){t='Atenção: este navegador não está salvando os dados';c='err';}
  else{
    var ds=daysSince(state.meta.lastBackup);
    if(state.entries.length&&(ds===null||ds>=7)){t='Salvo neste aparelho · faça um backup';c='warn';}
    else{t='Salvo neste aparelho';c='ok';}
  }
  el.textContent=t;el.className='status '+c;
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

/* ---------- layout ---------- */
root.innerHTML=
'<div class="wrap">'+
'<header><div><h1>Controle Financeiro</h1><div class="sub">Entradas por PIX e em espécie, despesas e saldo por semana e por mês</div></div><span id="status" class="status"></span></header>'+
'<section class="card"><h2 id="ftitle">Novo lançamento</h2>'+
'<form id="f" class="form" autocomplete="off">'+
'<label>Tipo<div class="seg" id="seg"><button type="button" data-t="entrada">Entrada</button><button type="button" data-t="despesa">Despesa</button></div></label>'+
'<label>Data<input type="date" id="fData" required></label>'+
'<label>Forma<select id="fForma"></select></label>'+
'<label>Valor (€)<input id="fValor" inputmode="decimal" placeholder="0,00" required></label>'+
'<label class="c2"><span id="lblCat">Origem / cliente</span><input id="fCat" list="dlCat" placeholder="opcional"></label>'+
'<label class="c2" style="grid-column:span 4">Descrição<input id="fDesc" placeholder="opcional"></label>'+
'<div class="actions c2"><button class="btn" id="fBtn" type="submit">Lançar</button><button class="btn ghost" id="fCancel" type="button" style="display:none">Cancelar</button></div>'+
'</form><datalist id="dlCat"></datalist><div id="fmsg" class="msg"></div></section>'+
'<div id="dash"></div>'+
'</div>';

var $=function(id){return document.getElementById(id);};
$('fData').value=todayISO();

function setTipo(t){
  ui.tipo=t;
  [].forEach.call($('seg').children,function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});
  var cur=$('fForma').value;
  var opts=t==='entrada'?['pix','especie']:['pix','especie','outro'];
  $('fForma').innerHTML=opts.map(function(o){return '<option value="'+o+'">'+(o==='outro'?'Outro (cartão, boleto…)':FORMA[o])+'</option>';}).join('');
  if(opts.indexOf(cur)>=0)$('fForma').value=cur;
  $('lblCat').textContent=t==='entrada'?'Origem / cliente':'Categoria';
  fillDatalist();
}
function fillDatalist(){
  var seen={};state.entries.forEach(function(e){if(e.tipo===ui.tipo&&e.cat)seen[e.cat]=1;});
  $('dlCat').innerHTML=Object.keys(seen).sort().map(function(c){return '<option value="'+esc(c)+'">';}).join('');
}
$('seg').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b)setTipo(b.getAttribute('data-t'));});
setTipo('entrada');

function msg(t,c){var m=$('fmsg');m.textContent=t;m.className='msg '+(c||'');if(c==='ok')setTimeout(function(){if(m.textContent===t)m.textContent='';},2500);}
function resetForm(){
  ui.editId=null;$('fValor').value='';$('fDesc').value='';$('fCat').value='';
  $('fBtn').textContent='Lançar';$('fCancel').style.display='none';$('ftitle').textContent='Novo lançamento';
}
$('fCancel').addEventListener('click',function(){resetForm();msg('');});
$('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var data=$('fData').value,valor=parseValor($('fValor').value);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){msg('Informe uma data válida.','err');return;}
  if(isNaN(valor)){msg('Informe um valor maior que zero (ex.: 1.250,00).','err');return;}
  var rec={data:data,tipo:ui.tipo,forma:$('fForma').value,valor:valor,desc:$('fDesc').value.trim(),cat:$('fCat').value.trim()};
  if(ui.editId){
    var e=state.entries.find(function(x){return x.id===ui.editId;});
    if(e){Object.keys(rec).forEach(function(k){e[k]=rec[k];});}
    msg('Lançamento alterado.','ok');
  }else{
    rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    state.entries.push(rec);
    msg((rec.tipo==='entrada'?'Entrada':'Despesa')+' de '+money(valor)+' lançada em '+br(data)+'.','ok');
  }
  ui.month=monthKey(data);
  resetForm();fillDatalist();render();scheduleSave();
  $('fValor').focus();
});

/* ---------- gráfico ---------- */
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v)));var s=[1,2,2.5,5,10];for(var i=0;i<s.length;i++)if(s[i]*p>=v)return s[i]*p;return 10*p;}
function chart(weeks){
  var W=640,H=230,pl=64,pr=10,pt=12,pb=34,ih=H-pt-pb;
  var mx=0;weeks.forEach(function(w){mx=Math.max(mx,w.r.ent,w.r.desp);});
  var top=mx>0?niceMax(mx):10000;
  var y=function(v){return pt+ih*(1-v/top);};
  var gw=(W-pl-pr)/weeks.length,bw=Math.min(30,gw*0.3);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Entradas e despesas por semana">';
  for(var g=0;g<=4;g++){var v=top*g/4,yy=y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end">'+esc(BRLc.format(v/100))+'</text>';}
  weeks.forEach(function(w,i){
    var cx=pl+gw*i+gw/2,x1=cx-bw-2,x2=cx+2,r=w.r,b=y(0);
    var hp=b-y(r.pix),he=b-y(r.esp),hd=b-y(r.desp);
    s+='<g><title>'+esc(w.label+' — PIX '+money(r.pix)+' | Espécie '+money(r.esp)+' | Despesas '+money(r.desp)+' | Saldo '+money(r.saldo))+'</title>';
    if(hp>0)s+='<rect x="'+x1+'" y="'+(b-hp)+'" width="'+bw+'" height="'+hp+'" fill="var(--pix)" rx="2"/>';
    if(he>0)s+='<rect x="'+x1+'" y="'+(b-hp-he)+'" width="'+bw+'" height="'+he+'" fill="var(--esp)" rx="2"/>';
    if(hd>0)s+='<rect x="'+x2+'" y="'+(b-hd)+'" width="'+bw+'" height="'+hd+'" fill="var(--desp)" rx="2"/>';
    s+='<rect x="'+(cx-gw/2)+'" y="'+pt+'" width="'+gw+'" height="'+ih+'" fill="transparent"/>';
    s+='<text x="'+cx+'" y="'+(H-18)+'" text-anchor="middle">Sem '+(i+1)+'</text><text x="'+cx+'" y="'+(H-5)+'" text-anchor="middle" style="font-size:10px">'+esc(w.short)+'</text></g>';
  });
  return s+'</svg>';
}

/* ---------- painel ---------- */
function render(){
  var mk=ui.month,y=Number(mk.slice(0,4)),m=Number(mk.slice(5,7));
  var inMonth=state.entries.filter(function(e){return monthKey(e.data)===mk;});
  var R=agg(inMonth);
  var acum=agg(state.entries.filter(function(e){return monthKey(e.data)<=mk;}));

  var months={};months[monthKey(todayISO())]=1;months[mk]=1;state.entries.forEach(function(e){months[monthKey(e.data)]=1;});
  var mlist=Object.keys(months).sort().reverse();

  var weeks=weeksOf(y,m).map(function(w){
    var list=inMonth.filter(function(e){var d=P(e.data).d;return d>=w.start&&d<=w.end;});
    var lbl=pad(w.start)+'/'+pad(m)+' a '+pad(w.end)+'/'+pad(m);
    return {r:agg(list),label:lbl,short:pad(w.start)+'–'+pad(w.end)};
  });

  var h='';
  h+='<div class="monthbar"><button class="btn ghost sm" data-act="prev" title="Mês anterior">◀</button><select id="mSel">'+mlist.map(function(k){return '<option value="'+k+'"'+(k===mk?' selected':'')+'>'+monthLabel(k)+'</option>';}).join('')+'</select><button class="btn ghost sm" data-act="next" title="Próximo mês">▶</button><span class="sub">'+inMonth.length+' lançamento(s) no mês</span></div>';

  h+='<div class="kpis">'+
    kpi('<i class="dot" style="background:var(--pix)"></i>Entradas PIX',money(R.pix),pct(R.pix,R.ent)+' das entradas')+
    kpi('<i class="dot" style="background:var(--esp)"></i>Entradas em espécie',money(R.esp),pct(R.esp,R.ent)+' das entradas')+
    kpi('Total de entradas',money(R.ent),'PIX + espécie')+
    kpi('<i class="dot" style="background:var(--desp)"></i>Despesas',money(R.desp),'PIX '+money(R.despPix)+' · Espécie '+money(R.despEsp)+(R.despOutro?' · Outro '+money(R.despOutro):''))+
    kpi('Saldo final do mês','<span class="'+cls(R.saldo)+'">'+money(R.saldo)+'</span>','entradas − despesas')+
  '</div>';
  h+='<div class="kpis2">'+
    kpi('Saldo em espécie no mês','<span class="'+cls(R.esp-R.despEsp)+'">'+money(R.esp-R.despEsp)+'</span>','espécie recebida − despesas pagas em espécie')+
    kpi('Saldo PIX no mês','<span class="'+cls(R.pix-R.despPix)+'">'+money(R.pix-R.despPix)+'</span>','PIX recebido − despesas pagas por PIX')+
    kpi('Saldo acumulado até '+MESES[m-1].toLowerCase(),'<span class="'+cls(acum.saldo)+'">'+money(acum.saldo)+'</span>','soma de todos os meses até este')+
  '</div>';

  // semanal
  var run=0,wrows=weeks.map(function(w,i){run+=w.r.saldo;return '<tr><td>Sem '+(i+1)+' <span class="sub">('+w.label+')</span></td><td>'+money(w.r.pix)+'</td><td>'+money(w.r.esp)+'</td><td>'+money(w.r.ent)+'</td><td>'+money(w.r.desp)+'</td><td class="'+cls(w.r.saldo)+'">'+money(w.r.saldo)+'</td><td class="'+cls(run)+'">'+money(run)+'</td></tr>';}).join('');
  h+='<div class="grid2"><section class="card"><h2>Resultado semanal — '+monthLabel(mk)+'</h2>'+
    '<div class="legend"><span><i class="dot" style="background:var(--pix)"></i>PIX</span><span><i class="dot" style="background:var(--esp)"></i>Espécie</span><span><i class="dot" style="background:var(--desp)"></i>Despesas</span></div>'+chart(weeks)+
    '<div class="sub" style="margin-top:6px">Semanas de segunda a domingo, recortadas dentro do mês.</div></section>'+
    '<section class="card"><h2>Tabela semanal</h2><div class="scroll"><table><thead><tr><th>Semana</th><th>PIX</th><th>Espécie</th><th>Entradas</th><th>Despesas</th><th>Saldo semana</th><th>Acum. mês</th></tr></thead><tbody>'+wrows+'</tbody>'+
    '<tfoot><tr><td>Total do mês</td><td>'+money(R.pix)+'</td><td>'+money(R.esp)+'</td><td>'+money(R.ent)+'</td><td>'+money(R.desp)+'</td><td class="'+cls(R.saldo)+'">'+money(R.saldo)+'</td><td></td></tr></tfoot></table></div></section></div>';

  // diário
  var nd=daysIn(y,m),days=[];
  for(var dd=1;dd<=nd;dd++){(function(dd){
    var iso=y+'-'+pad(m)+'-'+pad(dd);
    days.push({iso:iso,d:dd,r:agg(inMonth.filter(function(e){return e.data===iso;})),n:inMonth.filter(function(e){return e.data===iso;}).length});
  })(dd);}
  var today=todayISO(),tR=agg(state.entries.filter(function(e){return e.data===today;}));
  var DS=['dom','seg','ter','qua','qui','sex','sáb'];
  var drows=days.filter(function(x){return x.n>0;}).reverse().map(function(x){
    return '<tr'+(x.iso===today?' class="sel"':'')+'><td>'+br(x.iso)+' <span class="sub">'+DS[dow(y,m,x.d)]+'</span></td><td>'+money(x.r.pix)+'</td><td>'+money(x.r.esp)+'</td><td><b>'+money(x.r.ent)+'</b></td><td>'+money(x.r.desp)+'</td><td class="'+cls(x.r.saldo)+'">'+money(x.r.saldo)+'</td></tr>';
  }).join('');
  var dmax=0;days.forEach(function(x){dmax=Math.max(dmax,x.r.ent);});
  var dtop=dmax>0?niceMax(dmax):10000,DW=640,DH=170,dpl=56,dpr=6,dpt=10,dpb=22,dih=DH-dpt-dpb,dgw=(DW-dpl-dpr)/nd,dbw=Math.max(3,dgw*0.62);
  var dy=function(v){return dpt+dih*(1-v/dtop);};
  var ds='<svg viewBox="0 0 '+DW+' '+DH+'" width="100%" role="img" aria-label="Entradas por dia">';
  for(var g2=0;g2<=3;g2++){var vv=dtop*g2/3,yy2=dy(vv);ds+='<line x1="'+dpl+'" x2="'+(DW-dpr)+'" y1="'+yy2+'" y2="'+yy2+'" stroke="var(--line)"/><text x="'+(dpl-6)+'" y="'+(yy2+4)+'" text-anchor="end">'+esc(BRLc.format(vv/100))+'</text>';}
  days.forEach(function(x,i){
    var bx=dpl+dgw*i+(dgw-dbw)/2,b=dy(0),hp=b-dy(x.r.pix),he=b-dy(x.r.esp);
    ds+='<g><title>'+esc(br(x.iso)+' — Entradas '+money(x.r.ent)+' (PIX '+money(x.r.pix)+' | Espécie '+money(x.r.esp)+') | Despesas '+money(x.r.desp))+'</title>';
    if(hp>0)ds+='<rect x="'+bx+'" y="'+(b-hp)+'" width="'+dbw+'" height="'+hp+'" fill="var(--pix)" rx="1.5"/>';
    if(he>0)ds+='<rect x="'+bx+'" y="'+(b-hp-he)+'" width="'+dbw+'" height="'+he+'" fill="var(--esp)" rx="1.5"/>';
    ds+='<rect x="'+(dpl+dgw*i)+'" y="'+dpt+'" width="'+dgw+'" height="'+dih+'" fill="transparent"/>';
    if(x.d===1||x.d%5===0||x.d===nd)ds+='<text x="'+(dpl+dgw*i+dgw/2)+'" y="'+(DH-6)+'" text-anchor="middle"'+(x.iso===today?' style="font-weight:700"':'')+'>'+x.d+'</text>';
    ds+='</g>';
  });
  ds+='</svg>';
  var diasMov=days.filter(function(x){return x.r.ent>0;}).length;
  h+='<section class="card" style="margin-top:16px"><div class="row-between"><h2>Entradas por dia — '+monthLabel(mk)+'</h2><span class="sub">Hoje ('+br(today)+'): <b>'+money(tR.ent)+'</b> entraram · PIX '+money(tR.pix)+' · Espécie '+money(tR.esp)+'</span></div>'+
    '<div class="legend"><span><i class="dot" style="background:var(--pix)"></i>PIX</span><span><i class="dot" style="background:var(--esp)"></i>Espécie</span><span>Média por dia com entrada: <b>'+money(diasMov?Math.round(R.ent/diasMov):0)+'</b> ('+diasMov+' dia(s))</span></div>'+ds+
    (drows?'<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Dia</th><th>PIX</th><th>Espécie</th><th>Total entrou</th><th>Despesas</th><th>Saldo do dia</th></tr></thead><tbody>'+drows+'</tbody>'+
    '<tfoot><tr><td>Total do mês</td><td>'+money(R.pix)+'</td><td>'+money(R.esp)+'</td><td>'+money(R.ent)+'</td><td>'+money(R.desp)+'</td><td class="'+cls(R.saldo)+'">'+money(R.saldo)+'</td></tr></tfoot></table></div><div class="sub" style="margin-top:6px">A tabela mostra só os dias com lançamento.</div>':'<div class="empty">Nenhum lançamento neste mês.</div>')+
  '</section>';

  // mensal (ano)
  var yr=agg([]),mrows='';
  for(var i=1;i<=12;i++){
    var k=y+'-'+pad(i),r=agg(state.entries.filter(function(e){return monthKey(e.data)===k;}));
    ['pix','esp','ent','desp','saldo'].forEach(function(f){yr[f]+=r[f];});
    mrows+='<tr class="click'+(k===mk?' sel':'')+'" data-month="'+k+'"><td>'+MESES[i-1]+'</td><td>'+money(r.pix)+'</td><td>'+money(r.esp)+'</td><td>'+money(r.ent)+'</td><td>'+money(r.desp)+'</td><td class="'+cls(r.saldo)+'">'+money(r.saldo)+'</td></tr>';
  }
  h+='<section class="card" style="margin-top:16px"><h2>Resultado mensal — '+y+' <span class="sub">(clique num mês para abri-lo)</span></h2><div class="scroll"><table><thead><tr><th>Mês</th><th>PIX</th><th>Espécie</th><th>Entradas</th><th>Despesas</th><th>Saldo final</th></tr></thead><tbody>'+mrows+'</tbody>'+
    '<tfoot><tr><td>Total '+y+'</td><td>'+money(yr.pix)+'</td><td>'+money(yr.esp)+'</td><td>'+money(yr.ent)+'</td><td>'+money(yr.desp)+'</td><td class="'+cls(yr.saldo)+'">'+money(yr.saldo)+'</td></tr></tfoot></table></div></section>';

  // lançamentos
  var sorted=inMonth.slice().sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:0;});
  var lrows=sorted.map(function(e){
    var del=ui.confirmDel===e.id?'<button class="btn danger sm" data-act="del" data-id="'+e.id+'">Confirmar exclusão</button> <button class="btn ghost sm" data-act="nodel">Não</button>':'<button class="btn ghost sm" data-act="edit" data-id="'+e.id+'">Editar</button> <button class="btn ghost sm" data-act="askdel" data-id="'+e.id+'">Excluir</button>';
    return '<tr><td>'+br(e.data)+'</td><td class="l"><span class="tag '+e.tipo+'">'+(e.tipo==='entrada'?'Entrada':'Despesa')+'</span></td><td class="l">'+FORMA[e.forma]+'</td><td class="l">'+esc(e.cat)+'</td><td class="l">'+esc(e.desc)+'</td><td class="'+(e.tipo==='entrada'?'pos':'neg')+'">'+(e.tipo==='despesa'?'− ':'')+money(e.valor)+'</td><td>'+del+'</td></tr>';
  }).join('');
  h+='<section class="card"><div class="row-between"><h2>Lançamentos de '+monthLabel(mk)+'</h2><button class="btn ghost sm" data-act="csv">Copiar tudo em CSV</button></div>'+
    (sorted.length?'<div class="scroll"><table><thead><tr><th>Data</th><th class="l">Tipo</th><th class="l">Forma</th><th class="l">Origem / categoria</th><th class="l">Descrição</th><th>Valor</th><th></th></tr></thead><tbody>'+lrows+'</tbody></table></div>':'<div class="empty">Nenhum lançamento neste mês. Use o formulário acima.</div>')+
    '<div id="csvmsg" class="msg"></div></section>';

  var ds=daysSince(state.meta.lastBackup);
  h+='<section class="card"><h2>Backup dos dados</h2><div class="sub" style="margin-bottom:10px">Os lançamentos ficam guardados só neste celular. Se o navegador for limpo ou o aparelho trocado, eles se perdem. Guarde um backup de vez em quando (no Drive, e-mail ou WhatsApp).<br>Último backup: <b>'+(state.meta.lastBackup?br(state.meta.lastBackup.slice(0,10))+' ('+(ds===0?'hoje':ds+' dia(s) atrás')+')':'nunca')+'</b></div>'+
    '<div class="actions" style="flex-wrap:wrap"><button class="btn sm" data-act="export">Salvar backup</button><button class="btn ghost sm" data-act="import">Restaurar backup</button><input type="file" id="impFile" accept=".json,application/json" style="display:none"></div>'+
    (ui.pendingImport?'<div class="msg warn" style="color:var(--esp)">O backup tem '+ui.pendingImport.entries.length+' lançamento(s). Restaurar vai SUBSTITUIR os '+state.entries.length+' lançamento(s) atuais. <button class="btn danger sm" data-act="impok">Substituir</button> <button class="btn ghost sm" data-act="impno">Cancelar</button></div>':'')+
    '<div id="bkmsg" class="msg"></div></section>';

  $('dash').innerHTML=h;
  var imp=$('impFile');if(imp)imp.addEventListener('change',onImport);
  $('mSel').addEventListener('change',function(){ui.month=this.value;ui.confirmDel=null;render();});
}
function kpi(l,v,hint){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="h">'+hint+'</div></div>';}
function pct(a,b){return b?Math.round(a*100/b)+'%':'0%';}
function shiftMonth(d){var y=Number(ui.month.slice(0,4)),m=Number(ui.month.slice(5,7))+d;if(m<1){m=12;y--;}if(m>12){m=1;y++;}ui.month=y+'-'+pad(m);ui.confirmDel=null;render();}

$('dash').addEventListener('click',function(ev){
  var tr=ev.target.closest('tr[data-month]');
  var b=ev.target.closest('[data-act]');
  if(!b&&tr){ui.month=tr.getAttribute('data-month');ui.confirmDel=null;render();return;}
  if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(act==='prev')shiftMonth(-1);
  else if(act==='next')shiftMonth(1);
  else if(act==='askdel'){ui.confirmDel=id;render();}
  else if(act==='nodel'){ui.confirmDel=null;render();}
  else if(act==='del'){state.entries=state.entries.filter(function(e){return e.id!==id;});ui.confirmDel=null;if(ui.editId===id)resetForm();render();scheduleSave();}
  else if(act==='edit'){
    var e=state.entries.find(function(x){return x.id===id;});if(!e)return;
    ui.editId=id;setTipo(e.tipo);$('fData').value=e.data;$('fForma').value=e.forma;$('fValor').value=centsToInput(e.valor);$('fDesc').value=e.desc||'';$('fCat').value=e.cat||'';
    $('fBtn').textContent='Salvar alteração';$('fCancel').style.display='';$('ftitle').textContent='Editando lançamento de '+br(e.data);
    window.scrollTo({top:0,behavior:'smooth'});$('fValor').focus();
  }
  else if(act==='export'){doExport();}
  else if(act==='import'){$('impFile').click();}
  else if(act==='impok'){state.entries=ui.pendingImport.entries;ui.pendingImport=null;scheduleSave();fillDatalist();render();bk('Backup restaurado.','ok');}
  else if(act==='impno'){ui.pendingImport=null;render();}
  else if(act==='csv'){
    var q=function(s){s=String(s==null?'':s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    var lines=['Data;Tipo;Forma;Origem/Categoria;Descrição;Valor'].concat(state.entries.slice().sort(function(a,b){return a.data<b.data?-1:1;}).map(function(e){return [br(e.data),e.tipo==='entrada'?'Entrada':'Despesa',FORMA[e.forma],q(e.cat),q(e.desc),(e.tipo==='despesa'?'-':'')+centsToInput(e.valor)].join(';');}));
    var cm=$('csvmsg');
    try{navigator.clipboard.writeText(lines.join('\n')).then(function(){cm.textContent='CSV copiado ('+state.entries.length+' lançamentos). Cole no Excel ou Google Planilhas.';cm.className='msg ok';},function(){cm.textContent='O navegador bloqueou a cópia.';cm.className='msg err';});}catch(err){cm.textContent='O navegador bloqueou a cópia.';cm.className='msg err';}
  }
});

function bk(t,c){var m=$('bkmsg');if(m){m.textContent=t;m.className='msg '+(c||'');}}
function doExport(){
  var name='financeiro-backup-'+todayISO()+'.json';
  var blob=new Blob([JSON.stringify({app:'controle-financeiro',versao:1,gerado:new Date().toISOString(),entries:state.entries},null,1)],{type:'application/json'});
  function done(){state.meta.lastBackup=new Date().toISOString();scheduleSave();render();bk('Backup gerado: '+name,'ok');}
  try{
    var file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Backup Controle Financeiro'}).then(done).catch(function(e){if(e&&e.name==='AbortError')return;dl();});
      return;
    }
  }catch(e){}
  dl();
  function dl(){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1000);done();}
}
function onImport(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result),list=Array.isArray(o)?o:o.entries;
      if(!Array.isArray(list))throw 0;
      list=list.filter(function(e){return e&&/^\d{4}-\d{2}-\d{2}$/.test(e.data)&&(e.tipo==='entrada'||e.tipo==='despesa')&&FORMA[e.forma]&&Number.isInteger(e.valor)&&e.valor>0;})
        .map(function(e){return {id:String(e.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),data:e.data,tipo:e.tipo,forma:e.forma,valor:e.valor,desc:String(e.desc||''),cat:String(e.cat||'')};});
      if(!state.entries.length){state.entries=list;scheduleSave();fillDatalist();render();bk('Backup restaurado: '+list.length+' lançamento(s).','ok');}
      else{ui.pendingImport={entries:list};render();}
    }catch(e){bk('Arquivo inválido. Escolha um backup gerado por este app.','err');}
  };
  r.readAsText(f);ev.target.value='';
}
render();setStatus();
})();
</script></body></html>
